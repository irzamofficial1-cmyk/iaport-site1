        // page-edge click zones (above everything)
        const zr = div('zone zone-r', this.el);
        zr.dataset.zone = 'next';
        zr.style.cssText = `left:${W * 0.915}px;top:${-o}px;width:${W * 0.085 + o}px;height:${H + 2 * o}px`;
        zr.setAttribute('aria-hidden', 'true');
        const zl = div('zone zone-l', this.el);
        zl.dataset.zone = 'prev';
        zl.setAttribute('aria-hidden', 'true');
        zl.style.cssText = spread
            ? `left:${-W - o}px;top:${-o}px;width:${W * 0.085 + o}px;height:${H + 2 * o}px`
            : `left:0;top:${-o}px;width:${W * 0.085}px;height:${H + 2 * o}px`;
        for (const z of [zr, zl])
            z.style.transform = 'translateZ(60px)';
        this.pos = -1;
        this.render(this.pos < 0 ? 0 : this.pos);
        this.setTarget(this.target);
        this.hydrateIdle();
    }
    /** Fill the remaining pages while the browser is idle. */
    hydrateIdle() {
        const queue = [...this.leaves];
        const idle = 'requestIdleCallback' in window ? (cb) => window.requestIdleCallback(cb, { timeout: 1500 }) : (cb) => setTimeout(cb, 120);
        const step = () => {
            const l = queue.shift();
            if (!l)
                return;
            l.hydrate();
            idle(step);
        };
        idle(step);
    }
    /** Mark which faces are on screen (others are inert so keyboard/screen readers skip them). */
    setTarget(target) {
        // hydrate everything that can be on screen or in flight between the old and new position
        const lo = Math.max(0, Math.min(this.target, target) - 1);
        const hi = Math.min(this.leaves.length - 1, Math.max(this.target, target) + 1);
        for (let i = lo; i <= hi; i++)
            this.leaves[i].hydrate();
        this.target = target;
        for (const leaf of this.leaves) {
            const frontOn = leaf.i === target;
            const backOn = this.mode === 'spread' && leaf.i === target - 1;
            leaf.pf.inert = !frontOn;
            leaf.pb.inert = !backOn;
            leaf.pf.classList.toggle('is-current', frontOn);
            leaf.pb.classList.toggle('is-current', backOn);
            leaf.pf.setAttribute('aria-hidden', String(!frontOn));
            leaf.pb.setAttribute('aria-hidden', String(!backOn));
        }
    }
    /** Apply a (fractional) number of turned leaves to the whole scene. */
    render(pos) {
        this.pos = pos;
        const { t, W, o, mode } = this;
        let tr = 0;
        let tl = 0;
        for (const leaf of this.leaves) {
            const th = clamp(pos - leaf.i, 0, 1);
            const turning = th > 0.0008 && th < 0.9992;
            if (turning && !leaf.flexing)
                leaf.activate();
            else if (!turning && leaf.flexing)
                leaf.deactivate();
            leaf.apply(th);
            if (leaf.i >= 1) {
                tr += (1 - th) * t;
                tl += th * t;
            }
            this.cast(leaf, th, turning);
        }
        // paper edges
        this.stackR.style.height = `${tr.toFixed(2)}px`;
        this.stackR.style.transform = `translateZ(${tr.toFixed(2)}px) rotateX(-90deg)`;
        this.stackL.style.height = `${tl.toFixed(2)}px`;
        this.stackL.style.transform = `translateZ(${tl.toFixed(2)}px) rotateX(-90deg)`;
        this.stackL.style.display = mode === 'spread' ? '' : 'none';
        // camera: lies flat when closed, tips up to face the reader when open
        const open = smooth(Math.min(pos, 1));
        const spread = mode === 'spread';
        const tilt = spread ? lerp(54, 12, open) : lerp(36, 4, open);
        const sc = spread ? lerp(1.06, 1, open) : lerp(0.86, 1, open);
        // the scale is applied about the spine, so the centring offset must be scaled with it
        const centre = spread ? ((W + o) / 2) * (1 - open) : lerp((W + o) / 2, W / 2, open);
        const shift = -centre * sc;
        const lift = spread ? lerp(-6, -14, open) : -22;
        this.camera.style.transform = `translate3d(${shift.toFixed(1)}px,${lift}px,0) scale(${sc.toFixed(3)}) rotateX(${tilt.toFixed(2)}deg)`;
        // soft shadow beneath the whole book
        const lw = spread ? W * open : 0;
        this.shadow.style.cssText = `left:${(-lw - 16).toFixed(1)}px;top:${-o - 14}px;width:${(lw + W + o + 34).toFixed(1)}px;height:${this.H + 2 * o + 30}px;transform:translateZ(-${BOARD + 0.6}px)`;
    }
    cast(leaf, th, turning) {
        const rad = th * Math.PI;
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        const A = 0.5 * Math.pow(s, 0.8);
        const dark = (alpha, e, dir) => {
            const p1 = clamp(e - 0.06, 0, 1) * 100;
            const p2 = clamp(e + 0.32, 0, 1) * 100;
            return `linear-gradient(${dir},rgba(8,5,2,${alpha.toFixed(3)}) 0%,rgba(8,5,2,${(alpha * 0.85).toFixed(3)}) ${p1.toFixed(1)}%,rgba(8,5,2,0) ${p2.toFixed(1)}%)`;
        };
        if (leaf.castR) {
            if (turning && c >= 0) {
                leaf.castR.style.opacity = '1';
                leaf.castR.style.background = dark(A, c, '90deg');
            }
            else
                leaf.castR.style.opacity = '0';
        }
        if (leaf.castL) {
            if (turning && c < 0) {
                leaf.castL.style.opacity = '1';
                leaf.castL.style.background = dark(A, -c, '270deg');
            }
            else
                leaf.castL.style.opacity = '0';
        }
    }
}

        const down = e.key === 'ArrowDown' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey);
        if (down && engine.target >= engine.max)
            return; // last page: keys continue into the website
        const tag = e.target.tagName;
        const onControl = tag === 'BUTTON' || tag === 'A';
        switch (e.key) {
            case 'ArrowRight':
            case 'ArrowDown':
            case 'PageDown':
                e.preventDefault();
                go(engine.target + 1);
                break;
            case 'ArrowLeft':
            case 'ArrowUp':
            case 'PageUp':
                e.preventDefault();
                go(engine.target - 1);
                break;
            case ' ':
                if (!onControl) {
                    e.preventDefault();
                    go(engine.target + (e.shiftKey ? -1 : 1));
                }
                break;
            case 'Home':
                e.preventDefault();
                go(0);
                break;
            case 'End':
                e.preventDefault();
                go(engine.max);
                break;
        }
    });
    let drag = null;
    const range = () => dims.W * (dims.mode === 'spread' ? 1.15 : 0.85);
    stage.addEventListener('pointerdown', (e) => {
        if (!toc.hidden || e.target.closest('.ui'))
            return;
        if (e.pointerType === 'mouse' && e.button !== 0)
            return;
        drag = { x0: e.clientX, y0: e.clientY, id: e.pointerId, active: false, dir: 1, base: 0, vx: 0, lx: e.clientX, lt: performance.now(), prog: 0 };
    });
    addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.id)
            return;
        const dx = e.clientX - drag.x0;
        const dy = e.clientY - drag.y0;
        if (!drag.active) {
            if (Math.hypot(dx, dy) < 10)
                return;
            const dir = dx < 0 ? 1 : -1;
            const base = Math.round(engine.pos);
            if (Math.abs(dx) < Math.abs(dy) * 1.1 || (dir > 0 && base >= engine.max) || (dir < 0 && base <= 0) || engine.busy) {
                drag = null;
                return;
            }
            drag.active = true;
            drag.dir = dir;
            drag.base = base;
            engine.beginDrag();
            fadeHint();
            scene.classList.add('dragging');
        }
        const now = performance.now();
        const dt = Math.max(1, now - drag.lt);
        drag.vx = (e.clientX - drag.lx) / dt;
        drag.lx = e.clientX;
        drag.lt = now;
        drag.prog = clamp((drag.dir > 0 ? -dx : dx) / range(), 0, 1);
        engine.dragTo(drag.base + drag.dir * drag.prog);
    });
    const endDrag = (e, cancelled) => {
        if (!drag || e.pointerId !== drag.id)
            return;
        const d = drag;
        drag = null;
        if (!d.active)
            return;
        scene.classList.remove('dragging');
        suppressClick = true;
        setTimeout(() => (suppressClick = false), 0);
        const flick = d.dir > 0 ? -d.vx : d.vx; // px/ms in the turning direction
        const commit = !cancelled && (d.prog > 0.32 || flick > 0.45) && flick > -0.3;
        engine.endDrag(commit ? d.base + d.dir : d.base);
    };
    addEventListener('pointerup', (e) => endDrag(e, false));
    addEventListener('pointercancel', (e) => endDrag(e, true));
    /* ---------- sizing ---------- */
    function rebuild(keep) {
        const prevMode = book.mode;
        const t = keep ? engine.target : 0;
        const next = computeDims(innerWidth, innerHeight);
        const modeChanged = next.mode !== prevMode && keep;
        dims = next;
        let tpos = t;
        if (modeChanged) {
            tpos = next.mode === 'single' ? (t === 0 ? 0 : 2 * t - 1) : Math.ceil(t / 2);
        }
        book.build(dims);
        engine.setMax(leafCount(dims.mode) - 1, tpos);
        stage.dataset.mode = dims.mode;
    }
    let rt = 0;
    let lastW = innerWidth;
    let lastH = innerHeight;
    addEventListener('resize', () => {
        // ignore tiny mobile-browser-chrome height jitters
        if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 60)
            return;
        lastW = innerWidth;
        lastH = innerHeight;
        clearTimeout(rt);
        rt = window.setTimeout(() => rebuild(true), 140);
    });
    rebuild(false);
    /* ---------- website chrome: header background, reveal-on-scroll, pause the book off-screen ---------- */
    const topBar = document.getElementById('top');
    let ticking = false;
    const onScroll = () => {
        if (ticking)
            return;
        ticking = true;
        requestAnimationFrame(() => {
            topBar.classList.toggle('scrolled', scrollY > 40);
            ticking = false;
        });
    };
    addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    const reveal = new IntersectionObserver((entries) => {
        for (const en of entries) {
            if (en.isIntersecting) {
                en.target.classList.add('in');
                reveal.unobserve(en.target);
            }
        }
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    document.querySelectorAll('.rv').forEach((el) => reveal.observe(el));
    new IntersectionObserver(([en]) => {
        scene.style.visibility = en.isIntersecting ? '' : 'hidden';
    }).observe(stage);
    // test / debugging hook (also handy in the console)
    window.__book = { engine, book, go: (s) => go(spreadToPos(s)) };
}

})();
</script>
  </body>
</html>
